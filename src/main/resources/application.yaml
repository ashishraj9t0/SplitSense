spring:
  application:
    name: SplitSense

  security:
    user:
      name: admin
      password: password
  
  mail:
    host: ${MAIL_HOST}
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
      
  # DataSource Configuration for PostgreSQL
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    show-sql: false
    open-in-view: false

  # Logging Configuration
  logging:
    level:
      root: INFO
      com.splitsense: DEBUG

# Server Configuration
server:
  tomcat:
    basedir: C:/temp
  port: 8080
  servlet:
    context-path:
  compression:
    enabled: true
    min-response-size: 1024

# Application specific properties
app:
  name: SplitSense
  version: 1.0

  redis:
    host: localhost
    port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}

